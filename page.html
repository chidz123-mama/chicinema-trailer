<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0f" />
    <title>CHI CINEMA</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0f; color: #f2f0ec; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 42rem; padding: 2rem; text-align: center; }
      a { display: inline-block; margin-top: 1rem; padding: .7rem 1rem; border-radius: .4rem; background: #e50914; color: white; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">CHI CINEMA</h1>
      <p id="message">This area is being prepared.</p>
      <a href="index.html">Back to home</a>
    </main>
    <script>
      const section = new URLSearchParams(location.search).get("section");
      if (section) {
        const label = section.replace(/[-_]/g, " ").replace(/\b\w/g, (char) => char.toUpperCase());
        document.title = `${label} · CHI CINEMA`;
        document.querySelector("#title").textContent = label;
        document.querySelector("#message").textContent = `${label} is not available yet.`;
      }
    </script>
  </body>
</html>
