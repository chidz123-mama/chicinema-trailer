<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0f" />
    <title>Movie Details · CHI CINEMA</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/variables.css" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/navbar.css" />
    <link rel="stylesheet" href="styles/card.css" />
    <link rel="stylesheet" href="styles/row.css" />
    <link rel="stylesheet" href="styles/movie.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
  </head>
  <body>
    <a class="cc-skip-link" href="#main-content">Skip to content</a>
    <header class="cc-navbar" id="navbar">
      <div class="cc-navbar__inner">
        <a class="cc-navbar__brand" href="index.html" aria-label="CHI CINEMA home"><img class="cc-navbar__brand-mark" src="assets/logos/chi-cinema-mark.svg" alt="" /><span class="cc-navbar__brand-text">CHI <span>CINEMA</span></span></a>
        <nav class="cc-navbar__nav" aria-label="Main navigation">
          <a class="cc-navbar__link" href="index.html" data-page="home">Home</a>
          <a class="cc-navbar__link" href="index.html#row-popular">Phim</a>
          <a class="cc-navbar__link" href="index.html#row-tv-shows">TV Shows</a>
          <a class="cc-navbar__link" href="index.html#row-trending">Trending</a>
        </nav>
        <div class="cc-navbar__actions"><div id="navbar-auth-slot"></div><button class="cc-navbar__toggle" type="button" aria-label="Open or close menu" aria-expanded="false"><span class="cc-navbar__toggle-bar"></span><span class="cc-navbar__toggle-bar"></span><span class="cc-navbar__toggle-bar"></span></button></div>
      </div>
    </header>
    <main id="main-content">
      <section class="cc-movie-hero" id="movie-hero" aria-label="Movie details">
        <img class="cc-movie-hero__backdrop" id="movie-backdrop" alt="" />
        <div class="cc-movie-hero__scrim"></div>
        <div class="cc-movie-hero__inner">
          <div class="cc-movie-hero__poster"><img id="movie-poster" alt="" /></div>
          <div class="cc-movie-hero__info">
            <h1 class="cc-movie-hero__title" id="movie-title">Loading…</h1>
            <p class="cc-movie-hero__tagline" id="movie-tagline" hidden></p>
            <div class="cc-movie-hero__meta"><span class="cc-movie-hero__rating" id="movie-rating"></span><span id="movie-release-date"></span><span id="movie-runtime"></span><span id="movie-language"></span></div>
            <div class="cc-movie-hero__genres" id="movie-genres"></div>
            <p class="cc-movie-hero__overview" id="movie-overview"></p>
            <div class="cc-movie-hero__actions"><a class="cc-btn cc-btn--primary" id="movie-watch-btn" href="page.html?section=player">Watch now</a><button class="cc-btn cc-btn--ghost" id="movie-trailer-btn" type="button" hidden>Trailer</button><button class="cc-btn cc-btn--ghost cc-movie-hero__favorite" id="movie-favorite-btn" type="button"><span class="cc-btn-label">Add to favorites</span></button></div>
          </div>
        </div>
      </section>
      <section class="cc-movie-stats" id="movie-stats" aria-label="Movie information"></section>
      <section class="cc-movie-section" id="movie-cast-section"><h2 class="cc-movie-section__title">Cast</h2><div class="cc-cast-grid" id="movie-cast-grid"></div></section>
      <section class="cc-movie-section" id="movie-crew-section"><h2 class="cc-movie-section__title">Crew</h2><div class="cc-crew-list" id="movie-crew-list"></div></section>
      <section class="cc-movie-section" id="movie-gallery-section"><h2 class="cc-movie-section__title">Gallery</h2><div class="cc-gallery-grid" id="movie-gallery-grid"></div></section>
      <section class="cc-row" aria-label="Recommendations"><div class="cc-row__header"><h2 class="cc-row__title">Recommendations</h2></div><div class="cc-row__scroll-wrap"><div class="cc-row__track" id="recommendations-track"></div><div class="cc-row__arrow cc-row__arrow--prev"><button class="cc-row__arrow-btn" type="button" aria-label="Scroll left">‹</button></div><div class="cc-row__arrow cc-row__arrow--next"><button class="cc-row__arrow-btn" type="button" aria-label="Scroll right">›</button></div></div></section>
      <section class="cc-row" aria-label="Similar titles"><div class="cc-row__header"><h2 class="cc-row__title">Similar titles</h2></div><div class="cc-row__scroll-wrap"><div class="cc-row__track" id="similar-track"></div><div class="cc-row__arrow cc-row__arrow--prev"><button class="cc-row__arrow-btn" type="button" aria-label="Scroll left">‹</button></div><div class="cc-row__arrow cc-row__arrow--next"><button class="cc-row__arrow-btn" type="button" aria-label="Scroll right">›</button></div></div></section>
    </main>
    <div class="cc-trailer-modal" id="trailer-modal" hidden role="dialog" aria-modal="true" aria-label="Trailer"><div class="cc-trailer-modal__backdrop"></div><div class="cc-trailer-modal__frame-wrap" id="trailer-frame-wrap"></div><button class="cc-trailer-modal__close" id="trailer-modal-close" type="button" aria-label="Close trailer">×</button></div>
    <script type="module" src="scripts/movie.js"></script>
  </body>
</html>
